<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>D&D‑Map Bestellung</title>

    <!-- Fantasy‑Schriftarten -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: 'IM Fell English', serif;

            /* Stabiles Pergament */
            background: url('./img/pergament.jpeg') center center fixed;
            background-size: contain;
            background-repeat: repeat;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: rgba(255, 248, 230, 0.92);
            padding: 30px;
            border-radius: 12px;
            border: 4px solid #5a3e1b;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h2 {
            font-family: 'IM Fell English', serif;
            text-align: center;
            font-size: 32px;
            margin-bottom: 20px;
            color: #3b1f0f;
        }

        .dnd-font {
            font-family: 'Cinzel Decorative', serif;
            font-size: 30px;
            letter-spacing: 1px;
        }

        label {
            font-size: 18px;
            color: #3b1f0f;
            display: block;
            margin-top: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 0.5rem;
            border: 2px solid #5a3e1b;
            border-radius: 6px;
            background: #fff7e6;
            font-size: 16px;
            font-family: 'IM Fell English', serif;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #7a4a1f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            font-family: 'Cinzel Decorative', serif;
            cursor: pointer;
            margin-top: 1rem;
        }

        button:hover {
            background: #5e3617;
        }

        .banner {
            text-align: center;
            margin-bottom: 20px;
        }

        .banner img {
            width: 300px;
            max-width: 90%;     
            filter: drop-shadow(1px 1px 10px black);
        }

        #popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 248, 230, 0.95);
            padding: 30px;
            border: 4px solid #5a3e1b;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            font-size: 22px;
            display: none;
            z-index: 999;
        }

    </style>
</head>

<body>

<div class="banner">
    <img src="./img/DnD-Logo.png" alt="D&D Banner">
    
</div>

<div class="container">
    <h2>
        Bestellung für eine <span class="dnd-font">D&D</span>‑Map
    </h2>

    <label>Vorname:</label>
    <input id="firstname" type="text" required>

    <label>Nachname:</label>
    <input id="lastname" type="text" required>

    <label>E‑Mail Adresse:</label>
    <input id="email" type="email" required>

    <label>Beschreibung der gewünschten Map:</label>
    <textarea id="description" rows="5" required></textarea>

    <button onclick="sendOrder()">Abschicken</button>

    <div id="message"></div>
</div>

<div id="popup">Deine Bestellung wurde erfolgreich abgeschickt!</div>

<script>
    async function sendOrder() {
        const data = {
            firstname: document.getElementById("firstname").value,
            lastname: document.getElementById("lastname").value,
            email: document.getElementById("email").value,
            description: document.getElementById("description").value
        };

        const response = await fetch("/api/order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            showPopup();
        } else {
            alert("Fehler beim Abschicken.");
        }
    }

    function showPopup() {
        const popup = document.getElementById("popup");
        popup.style.display = "block";

        setTimeout(() => {
            popup.style.display = "none";
        }, 2500);
    }
</script>

</body>
</html>
